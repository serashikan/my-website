<!DOCTYPE html>
<html lang="zh-CN">

<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <meta name="author" content="selmuel">
    <title>音乐 · 塞拉爱米露的个人网站</title>
    <link rel="icon" href="图片/favicon.png" type="image/png">
    <!-- 全站共享样式 -->
    <link rel="stylesheet" href="风格.css">
    <style>
        .music-video { max-width: 1080px; }
        .music-video h1 { margin: 0 0 8px; font-size: clamp(24px, 3vw, 34px); color: var(--ink); }
        .music-video p { margin: 0 0 20px; }
        .music-video video { display: block; width: 100%; height: auto; aspect-ratio: 16 / 9; background: #111; border-radius: 12px; cursor: auto; }
    </style>
</head>

<body>
    <div class="mouse"></div>

    <div class="top-bar">
        <a class="logo-slot" href="主页.html" aria-label="回到主页">
            <img class="logo" src="图片/sera-milu-logo.webp?v=20261018-eyes-ponytail" width="1024" height="384" alt="sera&amp;milu" decoding="async">
        </a>
    </div>

    <!-- 主体：左目录 + 右内容 -->
    <div class="wrap">
        <aside class="sidebar">
            <p class="side-title">目录</p>
            <ul class="menu">
                <li>
                    <a href="#prologue" data-target="prologue" class="current">前言</a>
                </li>
                <li>
                    <a href="#tooku" data-target="tooku">遠く遠く遠く</a>
                </li>
            </ul>
        </aside>

        <main class="main">
            <div id="prologue" class="content">这是塞拉爱米露的音乐部分，塞拉爱米露是一名狂热的vocaloid粉丝，除此之外也欣赏其他的多种音乐风格。<br>
            这里记录着塞拉爱米露对一些音乐的评价以及塞拉爱米露自己的音乐尝试。</div>
            <section id="tooku" class="content music-video" aria-labelledby="tooku-title">
                <h1 id="tooku-title">遠く遠く遠く</h1>
                <p>完整版 · 1080p</p>
                <video controls playsinline preload="none" width="1920" height="1080"
                    poster="音频文件/遠く遠く遠く_封面.jpg" aria-label="遠く遠く遠く 完整版音乐视频">
                    <source src="音频文件/遠く遠く遠く_完整版_1080p.mp4" type="video/mp4">
                    你的浏览器暂不支持视频播放，可<a href="音频文件/遠く遠く遠く_完整版_1080p.mp4">打开视频文件</a>观看。
                </video>
            </section>
            <div id="txtBox" class="content"></div>
        </main>
    </div>
    <script>
        // 1. 获取所有菜单
        let links = document.querySelectorAll(".menu a");

        // 2. 获取两个核心内容区
        let prologue = document.getElementById("prologue");
        let txtBox = document.getElementById("txtBox");

        // 3. 给每个菜单加点击
        links.forEach(link => {
            link.onclick = function (event) {
                event.preventDefault();

                // ======================
                // 第一步：全部隐藏
                // ======================
                document.querySelectorAll(".content").forEach(content => content.classList.remove("active"));
                document.querySelectorAll("video").forEach(video => video.pause());
                txtBox.classList.remove("md");   // 换回纯文本时撤掉 Markdown 排版

                // ======================
                // 情况A：点击普通菜单（显示 prologue 或其他 div）
                // ======================
                if (this.dataset.target) {
                    let targetId = this.dataset.target;
                    document.getElementById(targetId).classList.add("active");
                }

                // ======================
                // 情况B：点击文件菜单（显示 txtBox）
                // ======================
                if (this.dataset.file) {
                    let filePath = this.dataset.file;
                    let ext = filePath.split('.').pop().toLowerCase();
                    if (ext === 'txt') {
                        fetch(filePath)
                            .then(res => res.text())
                            .then(text => {
                                txtBox.innerText = text;        // 把文本放进去
                                txtBox.classList.add("active"); // 显示盒子
                            });
                    }
                }

                // ======================
                // 标记当前正在看的条目
                // ======================
                if (this.closest(".menu")) {
                    document.querySelectorAll(".menu a.current")
                        .forEach(a => a.classList.remove("current"));
                    this.classList.add("current");
                }
            };
        });

        // 默认显示首页
        prologue.classList.add("active");

        // 选中所有1级菜单的链接
        const menuLinks = document.querySelectorAll(".menu > li > a");

        menuLinks.forEach(link => {
            link.addEventListener("click", function (e) {
                // 找到这个1级菜单后面的2级菜单列表
                const sub1 = this.nextElementSibling;

                // 如果后面真的有2级菜单，就切换它的显示/隐藏状态
                if (sub1 && sub1.classList.contains("sub1")) {
                    sub1.classList.toggle("active");
                }
            });
        });
    </script>

    <script src="鼠标.js"></script>

    <!-- ✰ webmeji 桌面小宠物（1 只 Miku）✰ -->
    <link rel="stylesheet" href="webmeji-main/webmeji.css">
    <script src="webmeji-main/config.js"></script>
    <script>
        // 覆盖 config.js 的默认 spawn 配置：只出 1 只 Miku
        window.SPAWNING = [{ id: 'webmeji-0', config: 'MIKU_CONFIG' }];
    </script>
    <script src="webmeji-main/webmeji.js"></script>
</body>

</html>
