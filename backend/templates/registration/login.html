{% extends "base.html" %}
{% block title %}登录{% endblock %}
{% block content %}
<p class="eyebrow">COME ON IN</p>
<h1>欢迎回来。</h1>
<p>这里是塞拉爱米露的个人网站。请使用站主为你创建的账号登录。</p>
<form method="post">
    {% csrf_token %}
    {{ form.as_p }}
    {% if next %}<input type="hidden" name="next" value="{{ next }}">{% endif %}
    <div class="actions"><button type="submit">登录</button><a href="{% url 'home' %}">回到门口</a></div>
</form>
{% endblock %}
