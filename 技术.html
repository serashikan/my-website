<body>

    <div class="top-bar">
        <a class="logo-slot" href="主页.html" aria-label="回到主页">
            <img class="logo" src="图片/文字logo去白.webp" alt="sera&amp;milu">
        </a>
    </div>

    <!-- 主体：左目录 + 右内容 -->
    <div class="wrap">
        <aside class="sidebar">
            <p class="side-title">目录</p>
            <ul class="menu">
                <li>
                    <a data-target="prologue">前言</a>
                </li>
                <li>
                    <a data-file="txt文件/小说辅助器.md">小说辅助器</a>
                    <ul class="sub1">
                        <li><a data-file="txt文件/蓝色的宝石和黑色的恶魔/第1章_上锁的天台.md">第1章 上锁的天台</a></li>
                        <li><a data-file="txt文件/蓝色的宝石和黑色的恶魔/第2章_宝石猎人.md">第2章 宝石猎人</a></li>
                        <li><a data-file="txt文件/蓝色的宝石和黑色的恶魔/第3章_恶魔的提案.md">第3章 恶魔的提案</a></li>
                        <li><a data-file="txt文件/蓝色的宝石和黑色的恶魔/第4章_千分之一的交易.md">第4章 千分之一的交易</a></li>
                        <li><a data-file="txt文件/蓝色的宝石和黑色的恶魔/第5章_第一颗石头.md">第5章 第一颗石头</a></li>
                        <li><a data-file="txt文件/蓝色的宝石和黑色的恶魔/第6章_夜市.md">第6章 夜市</a></li>
                    </ul>
                </li>
                <li>
                    <a>小游戏</a>
                    <ul class="sub1">
                        <li><a data-file="game-breakout.js">打砖块</a></li>
                        <li><a data-file="game-hanauta.js">花瓣占卜</a></li>
                    </ul>
                </li>
            </ul>
        </aside>

        <main class="main">
            <div id="prologue" class="content">这是塞拉爱米露的技术部分，塞拉爱米露是一名主业是生物技术的学生。<br>
            同时塞拉爱米露也很喜欢尝试cs相关的技术内容，这里会记录塞拉爱米露觉得有意思的cs与生物医学技术的学习哦。</div>
            <div id="txtBox" class="content"></div>
        </main>
    </div>
    <script>
        // 1. 获取所有菜单
        let links = document.querySelectorAll("a");

        // 2. 获取两个核心内容区
        let prologue = document.getElementById("prologue");
        let txtBox = document.getElementById("txtBox");

        // 动态插入一个普通 <script> 并等它加载完。
        // 为什么不用 import()：用 file:// 直接打开网页时，ES module 会被 CORS 拦掉
        // （origin 为 null），「打砖块」就点不开了；普通 <script> 没有这个限制。
        const scriptCache = new Map();
        function loadScript(src) {
            if (scriptCache.has(src)) return scriptCache.get(src);

            const p = new Promise((resolve, reject) => {
                const el = document.createElement("script");
                el.src = src;
                el.onload = () => {
                    // 游戏脚本会把自己注册到 window.SiteGames[脚本自身的 URL]。
                    // 用真实 URL 当键，脚本改名或者放在子目录里都不会错。
                    const game = window.SiteGames && window.SiteGames[el.src];
                    if (game) resolve(game);
                    else reject(new Error("脚本没有注册游戏：" + src));
                };
                el.onerror = () => reject(new Error("脚本加载失败：" + src));
                document.head.appendChild(el);
            });

            scriptCache.set(src, p);
            return p;
        }

        // 3. 给每个菜单加点击
        links.forEach(link => {
            link.onclick = async function () {

                // ======================
                // 第一步：先停掉正在跑的游戏，再清空 / 全部隐藏
                // ======================
                if (txtBox._module) {          // 如果这个 div 里有游戏
                    txtBox._module.stop();     // 停止游戏，否则切走后它还在后台空转
                    txtBox._module = null;
                }
                txtBox.innerHTML = "";

                prologue.classList.remove("active");
                txtBox.classList.remove("active");
                txtBox.classList.remove("md");   // 换回纯文本时撤掉 Markdown 排版

                // ======================
                // 情况A：点击普通菜单（显示 prologue 或其他 div）
                // ======================
                if (this.dataset.target) {
                    let targetId = this.dataset.target;
                    document.getElementById(targetId).classList.add("active");
                }

                // ======================
                // 情况B：点击文件菜单（显示 txtBox）
                // ======================
                if (this.dataset.file) {
                    let filePath = this.dataset.file;
                    let ext = filePath.split('.').pop().toLowerCase();
                    if (ext === 'txt') {
                        fetch(filePath)
                            .then(res => res.text())
                            .then(text => {
                                txtBox.innerText = text;        // 把文本放进去
                                txtBox.classList.add("active"); // 显示盒子
                            });
                    }

                    if (ext === 'md') {
                        fetch(filePath)
                            .then(res => {
                                if (!res.ok) throw new Error(`文件加载失败: ${res.status}`);
                                return res.text();
                            })
                            .then(text => {
                                if (typeof marked !== 'undefined') {
                                    txtBox.innerHTML = marked.parse(text); // 把 md 编译成 HTML
                                    txtBox.classList.add("md");            // 交给 Markdown 排版
                                } else {
                                    txtBox.innerText = text;               // marked 未加载时，至少显示原文
                                    console.warn('marked.js 未加载，显示原始md文本');
                                }
                                txtBox.classList.add("active");
                            })
                            .catch(err => {
                                txtBox.innerText = '加载失败: ' + err.message;
                                txtBox.classList.add("active");
                                console.error(err);
                            });
                    }

                    if (ext === 'js') {
                        try {
                            // 动态加载游戏脚本（普通 <script>，不是 ES module）
                            const module = await loadScript(filePath);
                            // 把模块存到元素上，方便切换时停止
                            txtBox._module = module;
                            // 初始化：把游戏渲染到当前这个 div 里
                            module.init(txtBox);
                            // 启动游戏
                            module.start();
                            txtBox.classList.add("active");
                        } catch (err) {
                            txtBox.innerText = '游戏加载失败：' + err.message;
                            txtBox.classList.add("active");
                            console.error(err);
                        }
                    }
                }

                // ======================
                // 标记当前正在看的条目
                // ======================
                if (this.closest(".menu")) {
                    document.querySelectorAll(".menu a.current")
                        .forEach(a => a.classList.remove("current"));
                    this.classList.add("current");
                }
            };
        });

        // 默认显示首页
        prologue.classList.add("active");

        // 选中所有1级菜单的链接
        const menuLinks = document.querySelectorAll(".menu > li > a");

        menuLinks.forEach(link => {
            link.addEventListener("click", function (e) {
                // 找到这个1级菜单后面的2级菜单列表
                const sub1 = this.nextElementSibling;

                // 如果后面真的有2级菜单，就切换它的显示/隐藏状态
                if (sub1 && sub1.classList.contains("sub1")) {
                    sub1.classList.toggle("active");
                }
            });
        });
    </script>

    <script src="鼠标.js"></script>

    <!-- ✰ webmeji 桌面小宠物（1 只 Miku）✰ -->
    <link rel="stylesheet" href="webmeji-main/webmeji.css">

    <script>
        // 覆盖 config.js 的默认 spawn 配置：只出 1 只 Miku
        window.SPAWNING = [{ id: 'webmeji-0', config: 'MIKU_CONFIG' }];
    </script>
    <script src="webmeji-main/webmeji.js"></script>
