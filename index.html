<!DOCTYPE html>
<html lang="zh-CN">

<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <meta name="author" content="selmuel">
    <title>(^▽^)/ 嗨～</title>
    <link rel="shortcut icon" href="图片/reze.png" type="image/png">

    <!-- 全站共享样式 -->
    <link rel="stylesheet" href="风格.css">

    <style>
        /* ===== 本页专属：墙纸 + 首页版式 ===== */

        /* 墙纸放在 html 上，body 用半透明暖色盖一层。
           （原来写在 body::before 上，z-index:-1 会把它压到 body 背景后面，
             等于白写了；现在这样才真的看得见。） */
        html {
            background-image: url("图片/are you lost墙纸.png");
            background-repeat: repeat;
            background-position: center;
            background-size: 560px auto;
            background-attachment: fixed;
            background-blend-mode: multiply;   /* 把偏冷的白底染成亚麻色 */
        }

        body.page-index {
            display: flex;
            flex-direction: column;
            align-items: center;
            gap: clamp(16px, 2.4vh, 26px);
            padding: 0 0 clamp(60px, 10vh, 110px);
            background-color: transparent;     /* 让 html 的墙纸透出来 */
            background-image:
                linear-gradient(180deg,
                    rgba(253, 247, 238, .74) 0%,
                    rgba(250, 240, 230, .70) 45%,
                    rgba(252, 244, 234, .80) 100%),
                radial-gradient(1200px 620px at 50% -12%, #fffaf2 0%, rgba(255, 250, 242, 0) 62%),
                radial-gradient(900px 520px at 102% 2%, rgba(222, 184, 135, .18) 0%, rgba(222, 184, 135, 0) 58%),
                radial-gradient(900px 620px at -4% 100%, rgba(255, 157, 187, .12) 0%, rgba(255, 157, 187, 0) 58%);
        }

        /* ---------- 主卡片 ---------- */
        .big-box {
            display: grid;
            grid-template-columns: minmax(0, 420px) minmax(0, 1fr);
            gap: clamp(22px, 3.4vw, 46px);
            align-items: center;
            width: min(1040px, calc(100% - 32px));
            margin-top: clamp(26px, 6vh, 66px);
            padding: clamp(20px, 2.8vw, 34px);
            background: linear-gradient(180deg, var(--surface), var(--paper));
            border: 1px solid var(--line-2);
            border-radius: var(--r-lg);
            box-shadow: var(--sh-3);
        }

        .hero-figure { margin: 0; }

        .hero-figure .photo {
            display: block;
            width: 100%;
            height: auto;
            border-radius: var(--r-md);
            border: 1px solid var(--line-2);
            box-shadow: var(--sh-2);
        }

        .hero-figure figcaption {
            margin-top: 12px;
            text-align: center;
        }

        .hero-name {
            margin: 0 0 4px;
            font-family: var(--font-pixel);
            font-size: 17px;
            letter-spacing: .08em;
            color: var(--brand-dark);
        }

        .hero-note {
            margin: 0;
            font-size: 13px;
            color: var(--ink-3);
        }

        /* ---------- 右侧欢迎语 ---------- */
        .hero-main {
            display: flex;
            flex-direction: column;
            align-items: center;
            text-align: center;
        }

        .icon {
            width: 104px;
            height: 104px;
            margin-bottom: 6px;
            background-image: url("图片/icon去背景.webp");
            background-repeat: no-repeat;
            background-position: center;
            background-size: contain;
            filter: drop-shadow(0 6px 14px rgba(122, 94, 62, .22));
        }
        @media (prefers-reduced-motion: no-preference) {
            .icon { animation: float 5.5s ease-in-out infinite; }
        }
        @keyframes float {
            0%, 100% { transform: translateY(0); }
            50%      { transform: translateY(-7px); }
        }

        .hero-title {
            margin: 10px 0 24px;
            font-size: clamp(18px, 1.62vw, 23px);
            font-weight: 700;
            line-height: 1.85;
            letter-spacing: .03em;
            color: var(--ink);
        }
        .hero-title [lang] {
            font-size: .82em;
            font-weight: 600;
            letter-spacing: .02em;
            color: var(--ink-2);
        }
        .hero-title [lang="ja"] { color: var(--ink-3); }

        .enter-btn {
            display: inline-flex;
            align-items: center;
            gap: 10px;
            padding: 13px 40px;
            font-family: var(--font-pixel);
            font-size: 19px;
            letter-spacing: .12em;
            color: #fff;
            background: linear-gradient(135deg, #d7b8d2 0%, #e8adc1 48%, var(--brand) 100%);
            border: 1px solid rgba(255, 255, 255, .5);
            border-radius: var(--r-pill);
            box-shadow:
                0 1px 0 rgba(255, 255, 255, .55) inset,
                var(--sh-2);
            transition: transform .22s var(--ease), box-shadow .22s var(--ease), filter .22s var(--ease);
        }
        .enter-btn::after {
            content: "→";
            transition: transform .22s var(--ease);
        }
        .enter-btn:hover {
            transform: translateY(-2px);
            filter: saturate(1.08);
            box-shadow:
                0 1px 0 rgba(255, 255, 255, .65) inset,
                var(--sh-3),
                0 0 0 6px rgba(222, 184, 135, .2);
        }
        .enter-btn:hover::after { transform: translateX(5px); }
        .enter-btn:active { transform: translateY(0) scale(.985); }

        /* ---------- 便签条 ---------- */
        .midbox {
            width: min(1040px, calc(100% - 32px));
            padding: 18px 26px;
            background: var(--surface);
            border: 1px solid var(--line-2);
            border-left: 4px solid var(--accent);
            border-radius: var(--r-md);
            box-shadow: var(--sh-1);
        }
        .midbox p {
            margin: 0;
            font-family: var(--font-pixel);
            font-size: 15px;
            line-height: 2.15;
            letter-spacing: .04em;
            color: var(--ink-2);
        }

        /* ---------- 点火按钮 ---------- */
        .btn {
            display: inline-flex;
            align-items: center;
            justify-content: center;
            min-width: 138px;
            height: 58px;
            margin: clamp(14px, 3vh, 34px) auto 0;
            padding: 0 34px;
            font-family: var(--font-pixel);
            font-size: 20px;
            letter-spacing: .16em;
            color: #4a3520;
            background: linear-gradient(180deg, #f5e2c2 0%, var(--brand) 58%, #d2aa7b 100%);
            border: 1px solid #cda97c;
            border-radius: var(--r-pill);
            box-shadow:
                0 1px 0 rgba(255, 255, 255, .75) inset,
                var(--sh-2);
            cursor: none;
            transition: transform .22s var(--ease), box-shadow .22s var(--ease), filter .22s var(--ease);
        }
        .btn:hover {
            transform: translateY(-2px);
            filter: saturate(1.07);
            box-shadow:
                0 1px 0 rgba(255, 255, 255, .85) inset,
                var(--sh-3),
                0 0 0 6px rgba(222, 184, 135, .22);
        }
        .btn:active { transform: translateY(0) scale(.985); }

        /* ---------- 窄屏 ---------- */
        @media (max-width: 880px) {
            .big-box { grid-template-columns: 1fr; }
            .hero-figure .photo { max-width: 340px; margin-inline: auto; }
        }
        @media (max-width: 520px) {
            .big-box { padding: 18px; }
            .midbox { padding: 16px 18px; }
            .midbox p { font-size: 13.5px; }
        }
    </style>
</head>

<body class="page-index">
    <div id="mouse" class="mouse"></div>

    <div class="big-box">
        <figure class="hero-figure">
            <img class="photo" src="图片/mephisto.webp" alt="梅菲斯特小姐的插画">
            <figcaption>
                <p class="hero-name">～梅菲斯特小姐～</p>
                <p class="hero-note"><s>（塞拉太懒了所以是让ai生成的捏）</s></p>
            </figcaption>
        </figure>

        <div class="hero-main">
            <div class="icon" role="img" aria-label="sera&amp;milu 的标志"></div>
            <h1 class="hero-title">
                欢迎来到塞拉爱米露的个人网站！<br>
                <span lang="en">Welcome to Selmuel's personal website!</span><br>
                <span lang="ja">世良詩観の個人Webサイトへようこそ！</span>
            </h1>
            <a class="enter-btn" href="主页.html">进入</a>
        </div>
    </div>

    <div class="midbox">
        <p>
            （按 z 键切换鼠标样式）<br>
            你肯定不知道单击任意位置可以放一朵小烟花！&hearts;<br>
            一次只能放一朵，可是，如果你靠近我的身边，我心里的烟花是千千万万朵哦。
        </p>
    </div>

    <button id="Fire" class="btn">点火</button>

    <script src="鼠标.js"></script>
    <script src="花火.js"></script>

    <!-- ✰ webmeji 桌面小宠物（1 只 Miku）✰ -->
    <link rel="stylesheet" href="webmeji-main/webmeji.css">
    <script src="webmeji-main/config.js"></script>
    <script>
        // 覆盖 config.js 的默认 spawn 配置：只出 1 只 Miku
        window.SPAWNING = [{ id: 'webmeji-0', config: 'MIKU_CONFIG' }];
    </script>
    <script src="webmeji-main/webmeji.js"></script>
</body>

</html>
