<!DOCTYPE html>
<html lang="zh-CN">

<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <meta name="author" content="selmuel">
    <title>塞拉爱米露的个人网站</title>
    <link rel="icon" href="图片/favicon.png" type="image/png">

    <!-- 全站共享样式 -->
    <link rel="stylesheet" href="风格.css">

    <style>
        /* ===== 本页专属：枢纽页版式 ===== */

        body { padding-bottom: clamp(50px, 8vh, 90px); }

        /* ---------- 开场 ---------- */
        .page-hero {
            width: min(880px, calc(100% - 40px));
            margin: clamp(26px, 5vh, 54px) auto clamp(26px, 4vh, 42px);
            text-align: center;
        }

        .title {
            margin: 0 0 22px;
            font-size: clamp(22px, 3.4vw, 32px);
            letter-spacing: .06em;
            /* 焦糖→藕粉的暖色渐变字 */
            background: linear-gradient(100deg, #8a6845 0%, #bb7f92 52%, #a8825a 100%);
            -webkit-background-clip: text;
            background-clip: text;
            color: transparent;
        }

        .page-hero .portrait {
            display: block;
            width: min(300px, 70%);
            height: auto;
            margin: 0 auto;
            border-radius: var(--r-lg);
            border: 1px solid var(--line-2);
            box-shadow: var(--sh-3);
        }

        .gag {
            margin: 16px 0 0;
            font-size: 14px;
            color: var(--ink-3);
        }

        .lead {
            margin: 0 auto;
            max-width: 62ch;
            font-size: 16px;
            line-height: 2.05;
            color: var(--ink-2);
            text-align: left;
        }

        /* 悬停才显形的黑块（保留原来的小机关） */
        .hide-text-box {
            position: relative;
            display: inline-block;
            padding: 2px 8px;
            border-radius: 8px;
            cursor: pointer;
        }
        .hide-mask {
            position: absolute;
            inset: 0;
            border-radius: 8px;
            background: linear-gradient(135deg, #4a3a2c, #2f251c);
            transition: opacity .28s var(--ease);
        }
        .hide-text-box:hover .hide-mask { opacity: 0; }

        /* ---------- 分区标题 ---------- */
        .section-title {
            display: flex;
            align-items: center;
            justify-content: center;
            gap: 16px;
            margin: clamp(30px, 5vh, 52px) auto 22px;
            font-size: clamp(19px, 2.4vw, 25px);
            letter-spacing: .08em;
            color: var(--ink);
        }
        .section-title::before,
        .section-title::after {
            content: "";
            width: clamp(28px, 6vw, 74px);
            height: 1px;
            background: linear-gradient(90deg, transparent, var(--brand));
        }
        .section-title::after {
            background: linear-gradient(90deg, var(--brand), transparent);
        }

        /* ---------- 分区卡片 ---------- */
        .card-grid {
            display: grid;
            grid-template-columns: repeat(auto-fit, minmax(288px, 1fr));
            gap: 20px;
            width: min(1080px, calc(100% - 40px));
            margin: 0 auto;
        }

        .box {
            position: relative;
            display: flex;
            flex-direction: column;
            min-height: 190px;
            padding: 24px 24px 20px;
            overflow: hidden;
            background: linear-gradient(180deg, var(--surface), var(--paper));
            border: 1px solid var(--line);
            border-radius: var(--r-md);
            box-shadow: var(--sh-1);
            transition: transform .28s var(--ease), box-shadow .28s var(--ease),
                        border-color .28s var(--ease), background .28s var(--ease);
        }
        /* 顶部一条渐变色带，悬停时从左展开 */
        .box::before {
            content: "";
            position: absolute;
            inset: 0 0 auto 0;
            height: 3px;
            background: linear-gradient(90deg, var(--brand-light), var(--accent), var(--brand-light));
            transform: scaleX(0);
            transform-origin: left;
            transition: transform .38s var(--ease);
        }

        .box h3 {
            margin: 0 0 10px;
            font-size: 19px;
            line-height: 1.5;
            color: var(--ink);
        }
        .box p {
            margin: 0;
            font-size: 14.5px;
            line-height: 1.9;
            color: var(--ink-2);
        }

        .box-more {
            margin-top: auto;
            padding-top: 16px;
            font-size: 13px;
            letter-spacing: .1em;
            color: var(--brand-dark);
            opacity: 0;
            transform: translateX(-6px);
            transition: opacity .28s var(--ease), transform .28s var(--ease);
        }
        .box-more::after {
            content: " →";
            transition: margin-left .28s var(--ease);
        }

        .box:hover {
            transform: translateY(-5px);
            border-color: var(--brand-light);
            background: linear-gradient(180deg, #fffefb, var(--brand-tint));
            box-shadow: var(--sh-3);
        }
        .box:hover::before { transform: scaleX(1); }
        .box:hover .box-more { opacity: 1; transform: none; }

        @media (prefers-reduced-motion: no-preference) {
            .big-box, .page-hero, .card-grid { animation: rise-in .6s var(--ease) both; }
        }

        .light:hover { color: var(--accent-deep); }

        /* 窄屏：卡片单列时不用再撑那么高，否则要滚很久 */
        @media (max-width: 620px) {
            .box { min-height: 0; padding: 20px 20px 18px; }
            .box-more { padding-top: 12px; }
        }
    </style>
</head>
