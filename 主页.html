.hide-mask {
  position: absolute;

  height: 100%;

  transition: all 0.2s ease;

  flex-shrink: 0;

.hide-text-box:hover .hide-mask {

    .mouse {

  background-image: url("miku指针去白1.gif");

  background-position: center; /* 图案居中 */

  /* 关键1：固定在屏幕上，不跟着网页滚动跑 */
  position: fixed;

  /* 关键2：永远在最上层，不被别的东西挡住 */
  z-index: 9999;

  /* 关键3：它不能挡住按钮点击！ */
  pointer-events: none;
}

.box{
    width:400px;
    height:200px;
    background-color: rgba(255,255,255,0.85);
    border-radius:16px;
    box-shadow: 0 8px 30px rgba(0,0,0,0.15);
    border: 1px solid rgba(255,255,255,0.5);
    backdrop-filter: blur(6px);
    transition: all 0.3s ease;
    cursor: pointer;
    border: 3px dashed #f8e8ee;
}

.box:hover {
    /* 背景变深一点 */
    background-color: #f5f5f5;
    /* 阴影变大更有层次 */
    box-shadow: 0 8px 20px rgba(0,0,0,0.15);
    /* 微微上浮一点点，很灵动 */
    transform: translateY(-4px);
}

.title{

  color: #444;

  /* 轻微文字阴影 柔和 */

}

.logo{

.logo:hover{
